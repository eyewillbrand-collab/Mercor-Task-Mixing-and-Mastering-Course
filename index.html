<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixing & Mastering Course</title><style>body{font:17px system-ui;background:#101827;color:#f5f7ff;max-width:850px;margin:auto;padding:30px}button,input{font:inherit;padding:10px;margin:8px}button{background:#1d6c70;color:white;border:1px solid #9de1d7;border-radius:8px}button:disabled{opacity:.4}section{border:1px solid #566;padding:25px;border-radius:15px}input{max-width:140px}#feedback{min-height:30px}</style><h1>From Session to Release</h1><p>Interactive recording engineering: seven competency checkpoints</p><p><a href="lab.html" style="color:#9de1d7">Open interactive mixing laboratory →</a></p><nav id="nav" aria-label="Course modules"></nav><section><h2 id="title"></h2><p id="detail"></p><p id="question"></p><label>Numeric answer <input id="answer" type="number" step="any"></label><button id="check">Check competency</button><p id="feedback" role="status"></p><button id="print" hidden>Print completion record / Save PDF</button></section><p><small>Educational numerical exercises only. Not an accredited certificate or real audio analyzer.</small></p><script>
const lessons=[
["Organization","Plan folders, versioning and backups.","For a three-copy backup rule, with one working copy, how many additional copies?",2],
["Gain Staging","Manage digital headroom.","An input peaks at -8 dBFS and gain is reduced 6 dB. New peak?",-14],
["Mixing","Model ideal hard-knee compression.","A signal is 12 dB above threshold with 4:1 compression. Gain reduction in dB?",9],
["Mastering","Review LUFS, true peak and translation.","A master measures -16 LUFS and increases by 2 LU through linear gain. Idealized result?",-14],
["Publishing","Check credits and rights splits.","Writer splits are 50%, 30% and the remainder. Remaining percent?",20],
["Marketing & SEO","Understand campaign measurement.","120 clicks from 4000 impressions. Click-through rate as a percent?",3],
["Release Readiness","Validate release assets.","19 of 20 required checklist items pass. Completion percent?",95]];
let passed=[];try{passed=JSON.parse(localStorage.getItem("mercor-passed")||"[]")}catch{}if(!Array.isArray(passed))passed=[];let current=0;
const el=id=>document.getElementById(id);
function render(){el("nav").replaceChildren();lessons.forEach((l,i)=>{const b=document.createElement("button");b.textContent=(passed.includes(i)?"✓ ":"")+(i+1)+" "+l[0];b.disabled=i>0&&!passed.includes(i-1);b.onclick=()=>{current=i;render()};el("nav").append(b)});const l=lessons[current];el("title").textContent=l[0];el("detail").textContent=l[1];el("question").textContent=l[2];el("answer").value="";el("feedback").textContent=passed.includes(current)?"Checkpoint passed.":"";el("print").hidden=!lessons.every((_,i)=>passed.includes(i))}
el("check").onclick=()=>{const raw=el("answer").value;const valid=raw.trim()!==""&&Number.isFinite(Number(raw))&&Math.abs(Number(raw)-lessons[current][3])<0.001;if(valid){if(!passed.includes(current))passed.push(current);try{localStorage.setItem("mercor-passed",JSON.stringify(passed))}catch{}render();el("feedback").textContent="Correct. Checkpoint passed."}else el("feedback").textContent="Not correct yet. Recalculate and retry."};el("print").onclick=()=>print();render();
</script></html>
